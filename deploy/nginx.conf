worker_processes  auto;
error_log  /tmp/nginx-error.log warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
    multi_accept on;
    use epoll;
}

http {
    include       /home/dogzi/.local/share/nginx/mime.types;
    default_type  application/octet-stream;

    # 临时目录
    client_body_temp_path  /tmp/nginx/body;
    proxy_temp_path        /tmp/nginx/proxy;
    fastcgi_temp_path      /tmp/nginx/fastcgi;
    uwsgi_temp_path        /tmp/nginx/uwsgi;
    scgi_temp_path         /tmp/nginx/scgi;

    # 日志
    access_log  /tmp/nginx-access.log;

    # 性能调优
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    reset_timedout_connection on;

    # GZip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 3;
    gzip_min_length 500;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    # 后端已压缩的，nginx 不重复解压再压缩
    gzip_disable "msie6";

    # proxy 缓冲优化
    proxy_request_buffering off;

    # 上游后端定义
    upstream backend_a_stock {
        server 127.0.0.1:9901 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }
    upstream backend_skillgate {
        server 127.0.0.1:9902 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }
    upstream backend_chanlun {
        server 127.0.0.1:9903 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }
    upstream backend_kronos {
        server 127.0.0.1:8765 max_fails=3 fail_timeout=10s;
        keepalive 8;
    }
    upstream backend_dashboard {
        server 127.0.0.1:9119 max_fails=3 fail_timeout=10s;
        keepalive 8;
    }

    # 通用 proxy 头部
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 缓冲
    proxy_buffer_size 8k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;
    proxy_temp_file_write_size 64k;
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    server {
        listen 9900 backlog=1024;
        server_name _;

        # CORS
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;

        # OPTIONS 预检（所有路径）
        if ($request_method = OPTIONS) { return 204; }

        # ========== SkillGate C2C ==========
        location ~ ^/skillgate/c2c$ {
            return 302 https://dogzi-ms-7d73.tailbc211b.ts.net/skillgate/c2c/;
        }
        location /skillgate/c2c/ {
            proxy_pass http://backend_skillgate/skillgate/c2c/;
        }

        # ========== SkillGate ==========
        location /skillgate/ {
            proxy_pass http://backend_skillgate/;
        }

        location /admin/ {
            proxy_pass http://backend_skillgate/admin/;
        }

        location ~ ^/c2c$ {
            return 302 https://dogzi-ms-7d73.tailbc211b.ts.net/c2c/;
        }
        location /c2c/ {
            proxy_pass http://backend_skillgate/skillgate/c2c/;
        }

        # ========== SkillGate API ==========
        location /openapi.json {
            proxy_pass http://backend_skillgate/openapi.json;
        }
        location ~ ^/(api/c2c/|api/demands/|api/services/) {
            proxy_pass http://backend_skillgate;
        }

        # ========== A-Stock API ==========
        location /api/auth/ {
            proxy_pass http://backend_a_stock;
        }

        # ========== Kronos ==========
        location /api/v1/kronos/ {
            proxy_pass http://backend_kronos;
        }

        # ========== A-Stock 数据 API ==========
        location ~ ^/(api/v1/|api/signals/|api/ai/|api/data/|uploads/) {
            proxy_pass http://backend_a_stock;
        }

        # ========== Chanlun-Chart ==========
        # TV API 路由 — 透传（chanlun 路由自带 /tv/ 前缀）
        location ~ ^/tv/(config|symbol_info|symbols|search|history|timescale_marks|marks|del_marks) {
            proxy_pass http://backend_chanlun;
        }
        # 静态文件 — 剥掉 /tv/ 前缀
        location /tv/static/ {
            rewrite ^/tv/static/(.*) /static/$1 break;
            proxy_pass http://backend_chanlun;
        }
        # 其余 /tv/ 下请求（首页、登录）— 剥掉 /tv/ 前缀到根路径
        location /tv/ {
            rewrite ^/tv/(.*) /$1 break;
            proxy_pass http://backend_chanlun;
            proxy_redirect ~^/(.*) /tv/$1;
            sub_filter_once off;
            sub_filter_types text/html text/javascript application/javascript;
            sub_filter '/static/' '/tv/static/';
            sub_filter '"/charting_library/' '"/tv/static/charting_library/';
            sub_filter 'init_web();' 'var c=new URLSearchParams(window.location.search).get("code");if(c){Utils.set_local_data("market","a");Utils.set_local_data("a_code",c);}init_web();';
        }

        # ========== Dashboard ==========
        location /dashboard/ {
            proxy_pass http://backend_dashboard;
        }

        # ========== 大单/资金流 ==========
        location ~ ^/(big-buy-summary/|bigbuy/|big-deal-summary/) {
            proxy_pass http://backend_a_stock;
        }

        # ========== RSS ==========
        location /rss-api/ {
            proxy_pass http://backend_a_stock;
        }

        # ========== 其他 /api/ → SkillGate ==========
        location /api/ {
            proxy_pass http://backend_skillgate;
        }

        # ========== A-Stock 前端（剥离 /a-stock 前缀） ==========
        location ~ ^/a-stock$ {
            return 302 https://dogzi-ms-7d73.tailbc211b.ts.net/a-stock/;
        }
        location /a-stock/ {
            rewrite ^/a-stock/(.*) /$1 break;
            proxy_pass http://backend_a_stock;
            proxy_buffering off;
        }

        # ========== 默认 → A-Stock ==========
        location / {
            proxy_pass http://backend_a_stock;
        }
    }
}
