<!doctype html>
<html lang="zh">
  <head>
    <title>AI量化工具-DOGE</title>

    <link
      rel="shortcut icon"
      href="{{ url_for('static', filename='favicon.ico') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/layui.css') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/app.css') }}" />

    <script
      type="text/javascript"
      src="{{ url_for('static', filename='jquery-3.7.0.min.js') }}"></script>

      src="{{ url_for('static', filename='layui.js') }}"></script>

      src="{{ url_for('static', filename='xm-select.js') }}"></script>

  <body>
    <div class="layui-fluid" style="padding: 0">
      <div class="layui-row">
        <div
          class="layui-col-xs10 layui-col-sm10 layui-col-md10"
          id="chart_container"
          style="display: flex; flex-direction: column; height: 100vh">
          {# 图表内容 #}
          <div
            id="tv_charts_area"
            style="
              width: 100%;
              height: 100%;
              display: flex;
              flex-direction: column;
            "></div>
        </div>
        <div
          class="layui-col-xs2 layui-col-sm2 layui-col-md2"
          id="chart_menu"
          style="
            position: fixed;
            top: 0;
            bottom: 0;
            right: 0;
            overflow: scroll;
            padding: 0;
            margin: 0;
          ">
          <div style="padding: 10px">
            <div class="layui-inline" style="width: 100%">
              <div style="display:flex; align-items:center; gap:4px; width:100%;">
              <h2 style="font-size:17px; margin:0; white-space:nowrap;">AI缠Tool</h2>
              <button id="btnEngineCl" class="layui-btn layui-btn-xs layui-btn-primary" style="border-color:#16baaa; color:#16baaa; padding:0 5px;" onclick="switchEngine('cl')">cl</button>
              <button id="btnEngineCl1" class="layui-btn layui-btn-xs layui-btn-primary" style="border-color:#888; color:#888; padding:0 5px;" onclick="switchEngine('cl1')">cl1</button>
              <button id="btnEngineCl2" class="layui-btn layui-btn-xs layui-btn-primary" style="border-color:#888; color:#888; padding:0 5px;" onclick="switchEngine('cl2')">cl2</button>
              <button id="btnEngineCl3" class="layui-btn layui-btn-xs layui-btn-primary" style="border-color:#888; color:#888; padding:0 5px;" onclick="switchEngine('cl3')">cl3</button>
              <div id="toggle-menu" style="margin-left:auto; cursor:pointer;">
                <i class="layui-icon layui-icon-shrink-right"></i>
              </div>
            </div>
            </div>
            <hr class="layui-border-red" />
            <form
              class="layui-form layui-form-pane"
              lay-filter="select_market_form">
              <div class="layui-form-item">
                <div class="layui-input-block" style="margin: 0; padding: 0">
                  <label>
                    <select name="market" lay-filter="select_market">
                      <option value="a">沪深A股</option>
                      <option value="hk">港股</option>
                      <option value="futures">国内期货</option>
                      <option value="ny_futures">纽约期货</option>
                      <option value="fx">外汇</option>
                      <option value="us">美股</option>
                      <option value="currency">数字货币(合约)</option>
                      <option value="currency_spot">数字货币(现货)</option>
                    </select>
                  </label>
                </div>
              </div>
              <div class="layui-form-item">
                <div id="code_search" class="xm-select-demo"></div>
              </div>
              <div class="layui-form-item" style="margin-bottom: 0;">
                <div class="layui-input-block" style="margin: 0; padding: 0">
                  <label>
                    <select name="chart_frequency" id="chart_frequency" lay-filter="chart_frequency">
                    </select>
                  </label>
                </div>
              </div>
            </form>
          </div>
          <div class="layui-collapse lay-accordion" lay-filter="collapse-opts">
            <div class="layui-colla-item">
              {# 自选内容 #}
              <div class="layui-colla-title" data-ca-title="自选组">自选组</div>
              <div
                class="layui-colla-content layui-show"
                style="padding: 0; position: relative; height: 100%">
                <form
                  class="layui-form zixuan-form-bg"
                  style="
                    width: 100%;
                    position: sticky;
                    top: 0;
                    z-index: 10;
                    padding: 5px 0;
                  ">
                  <div class="layui-form-item">
                    <div class="layui-inline">
                      <div
                        class="layui-input-inline layui-input-wrap"
                        style="width: 60%; float: left">
                        <label for="zixuan_groups">
                          <select
                            id="zixuan_groups"
                            name="zixuan_groups"
                            lay-filter="select_zx_group"></select>
                        </label>
                      </div>
                      <div
                        class="layui-form-mid"
                        style="padding: 4px 0 !important; float: left">
                        <button
                          type="button"
                          id="add_zixuan"
                          class="layui-btn layui-btn-primary layui-border-red layui-btn-sm">
                          <i class="layui-icon layui-icon-add-1"></i> 自选
                        </button>
                      </div>
                      <div
                        class="layui-form-mid"
                        style="padding: 4px 0 !important; float: left">
                        <button
                          type="button"
                          id="refresh_zixuan"
                          class="layui-btn layui-btn-primary layui-border-red layui-btn-sm">
                          <i class="layui-icon layui-icon-refresh"></i>
                        </button>
                      </div>
                    </div>
                  </div>
                </form>
                <div
                  style="
                    overflow-y: auto;
                    height: calc(100% - 50px);
                    margin-top: 5px;
                  ">
                  <table
                    class="layui-hide"
                    id="table_zixuan_list"
                    style="width: 100%"></table>
                </div>
                <hr class="layui-border-red" />
              </div>
            </div>
            <div class="layui-colla-item">
              <div class="layui-colla-title" data-ca-title="监控提醒">
                监控提醒
              </div>
              <div class="layui-colla-content" style="padding: 0">
                <form
                  class="layui-form"
                  lay-filter="alert_records_form"
                  style="padding: 10px 10px 0 10px">
                  <div class="layui-form-item">
                    <label class="layui-form-label">任务名称</label>
                    <div class="layui-input-block">
                      <select
                        name="task_name_select"
                        id="task_name_select"
                        lay-filter="task_name_select">
                        <option value="">全部</option>
                      </select>
                    </div>
                  </div>
                </form>
                <table
                  class="layui-hide"
                  id="table_alert_reocrds"
                  lay-filter="table_alert_reocrds"></table>
                <hr class="layui-border-red" />
              </div>
            </div>
            <div class="layui-colla-item" id="collapse-bkgn">
              <div class="layui-colla-title" data-ca-title="板块概念">
                板块概念
              </div>
              <div class="layui-colla-content" style="padding: 0">
                <form
                  class="layui-form"
                  lay-filter="bkgn_form"
                  style="padding: 10px 10px 0 10px">
                  <div class="layui-form-item" style="margin-bottom: 5px">
                    <div class="layui-input-inline" style="width: 100%">
                      <div id="bkgn_xm_select"></div>
                    </div>
                  </div>
                </form>
                <div style="padding: 10px">
                  <table
                    class="layui-hide"
                    id="bkgn_table"
                    lay-filter="bkgn_table"
                    style="width: 100%; display: none"></table>
                </div>
                <hr class="layui-border-red" />
              </div>
            </div>
            <div class="layui-colla-item">
              <div class="layui-colla-title" data-ca-title="AI分析助手">
                AI分析助手
              </div>
              <div class="layui-colla-content" style="padding: 0">
                <form class="layui-form" style="width: 100%">
                  <div class="layui-form-item">
                    <div class="layui-inline">
                      <div
                        class="layui-input-inline layui-input-wrap"
                        style="width: 40%; float: left">
                        <label for="ai_code">
                          <input
                            type="text"
                            name="ai_code"
                            id="ai_code"
                            autocomplete="off"
                            readonly="readonly"
                            class="layui-input" />
                        </label>
                      </div>
                      <div
                        class="layui-form-mid"
                        style="width: 30%; padding: 0 !important; float: left">
                        <label>
                          <select
                            name="ai_frequencys"
                            id="ai_frequencys"></select>
                        </label>
                      </div>
                      <div
                        class="layui-form-mid"
                        style="padding: 4px 0 !important; float: left">
                        <button
                          type="button"
                          id="ai_analyse_btn"
                          class="layui-btn layui-btn-primary layui-border-red layui-btn-sm">
                          分析
                        </button>
                      </div>
                    </div>
                  </div>
                </form>
                <table
                  class="layui-hide"
                  id="table_ai_analysis"
                  lay-filter="table_ai_analysis"></table>

                <hr class="layui-border-red" />
              </div>
            </div>
            <div class="layui-colla-item">
              <div class="layui-colla-title" data-ca-title="笔修正">笔修正</div>
              <div class="layui-colla-content" style="padding: 0">
                <div style="padding: 8px 16px">
                  <label><input type="checkbox" value="1" checked disabled> 极值修正</label><br>
                  <label><input type="checkbox" value="1" checked disabled> 端点同步</label><br>
                  <label><input type="checkbox" value="1" checked disabled> 最少5CLK线校验</label>
                </div>
                <hr class="layui-border-red" />
              </div>
            </div>
            <div class="layui-colla-item">
              <div class="layui-colla-title" data-ca-title="K线配色">K线配色</div>
              <div class="layui-colla-content" style="padding: 0">
                <div style="padding: 8px 16px">
                  <label><input type="checkbox" value="1" checked onchange="window.toggleKlineColor()" id="kline_cn_style"> 红涨绿跌</label>
                </div>
                <hr class="layui-border-red" />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    {% include 'sub_temp.html' %}
  </body>
  <script>
    // 定时更新tick涨跌幅的对象
    var interval_update_rates;
    var interval_get_alert_records;

    var market_frequencys = `{{ market_frequencys| tojson }}`;
    // 解析 json 字符串
    var market_frequencys = JSON.parse(market_frequencys);

    var default_vals = {
      theme: "Light",
      market: "a",
      a_interval_1: "1D",
      a_interval_2: "1D",
      hk_interval_1: "1D",
      hk_interval_2: "1D",
      us_interval_1: "1D",
      us_interval_2: "1D",
      fx_interval_1: "1D",
      fx_interval_2: "1D",
      futures_interval_1: "1D",
      futures_interval_2: "1D",
      ny_futures_interval_1: "1D",
      ny_futures_interval_2: "1D",
      currency_interval_1: "1D",
      currency_interval_2: "1D",
      currency_spot_interval_1: "1D",
      currency_spot_interval_2: "1D",
      chart_layout_type: "single",
      a_code: "{{ market_default_codes.a }}",
      hk_code: "{{ market_default_codes.hk }}",
      us_code: "{{ market_default_codes.us }}",
      fx_code: "{{ market_default_codes.fx }}",
      futures_code: "{{ market_default_codes.futures }}",
      ny_futures_code: "{{ market_default_codes.ny_futures }}",
      currency_code: "{{ market_default_codes.currency }}",
      currency_spot_code: "{{ market_default_codes.currency_spot }}",
    };
    var chart_widgets = [];

    // 变更图表展示的标的
    function change_chart_ticker(_market, _code) {
      var market = _market;
      var code = _code;
      Utils.set_local_data("market", market);
      Utils.set_local_data(market + "_code", code);
      layui.each(chart_widgets, function (i, w) {
        w.activeChart().setSymbol(market + ":" + code);
      });
      ZiXuan.render_zixuan_opts();
    }
  </script>

  <script>
    // 缠论引擎切换
    window.switchEngine = function(engine) {
      Utils.set_local_data('cl_engine', engine);
      document.cookie = 'cl_engine=' + engine + '; path=/';
      location.reload();
    };
    window.toggleKlineColor = function() {
      var el = document.getElementById('kline_cn_style');
      var val = el && el.checked ? '1' : '0';
      Utils.set_local_data('kline_cn_style', val);
      location.reload();
    };
    (function(){
      var saved = Utils.get_local_data('kline_cn_style');
      if(saved !== null && saved !== undefined) {
        var el = document.getElementById('kline_cn_style');
        if(el) el.checked = saved === '1';
      }
      // 首次加载默认保存为'1'（红涨绿跌）
      if(saved === null || saved === undefined) {
        Utils.set_local_data('kline_cn_style', '1');
      }
      var engine = Utils.get_local_data('cl_engine') || 'cl1';
      document.cookie = 'cl_engine=' + engine + '; path=/';
      ['Cl','Cl1','Cl2','Cl3'].forEach(function(n){
        var el = document.getElementById('btnEngine'+n);
        if(el){
          if(engine === n.toLowerCase()){
            el.style.borderColor = '#16baaa';
            el.style.color = '#16baaa';
          }else{
            el.style.borderColor = '#888';
            el.style.color = '#888';
          }
        }
      });
    })();

    $(function () {
      // 缠论配置项更改
      layui.use(function () {
        var layer = layui.layer;
        var element = layui.element;
        var form = layui.form;
        var util = layui.util;
        var dropdown = layui.dropdown;

        // 下拉菜单事件
        dropdown.render({
          elem: "#toggle-menu",
          data: [
            {
              title: "缠论配置项",
              templet:
                '<div><i class="layui-icon layui-icon-set"></i> <span>缠论配置项</span></div>',
              id: 1,
            },
            {
              title: "自选组管理",
              templet:
                '<div><i class="layui-icon layui-icon-templeate-1"></i> <span>自选组管理</span></div>',
              id: 2,
            },
            {
              title: "监控列表",
              templet:
                '<div><i class="layui-icon layui-icon-list"></i> <span>监控列表</span></div>',
              id: 3,
            },
            {
              title: "新增监控",
              templet:
                '<div><i class="layui-icon layui-icon-speaker"></i> <span>新增监控</span></div>',
              id: 4,
            },
            {
              title: "运行选股",
              templet:
                '<div><i class="layui-icon layui-icon-speaker"></i> <span>运行选股</span></div>',
              id: 4,
            },
            {
              title: "当前任务",
              templet:
                '<div><i class="layui-icon layui-icon-senior"></i> <span>当前任务</span></div>',
              id: 6,
            },
            {
              title: "切换图表布局",
              templet:
                '<div><i class="layui-icon layui-icon-carousel"></i> <span>切换图表布局</span></div>',
              id: 7,
              child: [
                {
                  title: "布局-单图",
                  id: "single",
                },
                {
                  title: "布局-横向双图",
                  id: "horizontal-2",
                },
                {
                  title: "布局-横向7/3",
                  id: "horizontal-7-3",
                },
                {
                  title: "布局-纵向双图",
                  id: "vertical-2",
                },
                {
                  title: "布局-三图",
                  id: "three",
                },
                {
                  title: "布局-四图",
                  id: "four",
                },
              ],
            },
            {
              title: "切换主题",
              templet:
                '<div><i class="layui-icon layui-icon-engine"></i> <span>切换主题</span></div>',
              id: 8,
            },
          ],
          click: function (item) {
            if (item.title === "缠论配置项") {
              layer.open({
                type: 2,
                title: "缠论配置项变更",
                area: ["1100px", "90vh"],
                content:
                  "/get_cl_config/" +
                  Utils.get_market() +
                  "/" +
                  Utils.get_code().replace("/", "__"),
                anim: 1,
                fixed: true, // 不固定
                shadeClose: true,
              });
            } else if (item.title === "自选组管理") {
              layer.open({
                type: 2,
                title: "自选组管理",
                area: ["800px", "50vh"],
                content: "/zixuan_group/" + Utils.get_market(),
                anim: 1,
                fixed: true, // 不固定
                shadeClose: true,
              });
            } else if (item.title === "监控列表") {
              layer.open({
                type: 1,
                title: "监控列表",
                area: ["1000px", "50vh"],
                content: $("#layer-wrapper-alert-task-list"),
                anim: 1,
                fixed: true, // 不固定
                shadeClose: true,
                btn: ["刷新"],
                btn1: function (index, layero, that) {
                  Alert.refresh_alerts_table();
                },
                success: function (layero, index, that) {
                  // 初始渲染表格
                  if (typeof Alert.refresh_alerts_table === "function") {
                    Alert.refresh_alerts_table();
                  }
                },
                end: function () {
                  $("#layer-wrapper-alert-task-list").hide();
                },
              });
            } else if (item.title === "新增监控") {
              layer.open({
                type: 2,
                title: "新增监控提醒",
                area: ["1000px", "90vh"],
                content: "/alert_edit/" + Utils.get_market() + "/0",
                anim: 1,
                fixed: true, // 不固定
                shadeClose: true,
              });
            } else if (item.title === "运行选股") {
              layer.open({
                type: 2,
                title: "运行选股",
                area: ["1000px", "50vh"],
                content: "/xuangu/task_list/" + Utils.get_market(),
                anim: 1,
                fixed: true, // 不固定
                shadeClose: true,
              });
            } else if (item.title === "当前任务") {
              layer.open({
                type: 2,
                title: "当前任务",
                area: ["1000px", "50vh"],
                content: "/jobs",
                anim: 1,
                fixed: true, // 不固定
                shadeClose: true,
              });
            } else if (item.title.startsWith("布局-")) {
              Utils.set_local_data("chart_layout_type", item.id);
              location.reload();
            } else if (item.title === "切换主题") {
              let theme = Utils.get_local_data("theme");
              if (theme === "Light") {
                Utils.set_local_data("theme", "dark");
              } else {
                Utils.set_local_data("theme", "Light");
              }
              location.reload();
            } else if (item.title === "系统设置") {
              layer.open({
                type: 2,
                title: "系统设置",
                area: ["1000px", "50vh"],
                content: "/setting",
                anim: 1,
                fixed: true, // 不固定
                shadeClose: true,
              });
            }
          },
        });

        // 自选操作初始
        ZiXuan.init_zixuan_opts();

        // 折叠面板事件
        element.on("collapse(collapse-opts)", function (data) {
          let is_open = data.show; // 得到当前面板的展开状态，true or false
          let ca_title = $(data.title).attr("data-ca-title"); // 得到当前点击面板的标题区域对象

          if (ca_title === "自选组") {
            if (is_open) {
              interval_update_rates = setInterval(
                ZiXuan.stocks_update_rate(),
                30000,
              );
            } else {
              clearInterval(interval_update_rates);
            }
          }
          if (ca_title === "监控提醒") {
            if (is_open) {
              Alert.init();
              // 获取警报记录
              Alert.get_alert_records();
              interval_get_alert_records = setInterval(
                Alert.get_alert_records,
                60000,
              );
            } else {
              clearInterval(interval_get_alert_records);
            }
          }

          if (ca_title === "板块概念") {
            if (is_open) {
              // 板块概念
              BKGN.init_bkgn_opts();
            }
          }
        });

        // 初始赋值
        form.val("select_market_form", {
          market: Utils.get_market(),
        });
        // 表单变动
        form.on("select(select_market)", function (data) {
          var market = data.value;
          Utils.set_local_data("market", market);
          location.reload();
        });

        // 固定条，显示与隐藏菜单栏
        Utils.render_fixbar();

        // AI 分析助手
        AI.init_ai_opts();
        AI.get_ai_analyse_records();
      });

      // 初始化展示页面
      let macdChartInstance = null;
      var macdCrosshairLine = null;

      // 从 TV iframe 内测量价格轴宽度（同源 iframe 可访问）
      function measureLeftScaleWidth(callback) {
        var tvContainer = document.getElementById('tv_chart_container_1');
        if (!tvContainer) { callback(65); return; }
        var iframe = tvContainer.querySelector('iframe');
        if (!iframe) { callback(65); return; }
        try {
          var idoc = iframe.contentDocument || iframe.contentWindow.document;
          if (!idoc) { callback(65); return; }
          var table = idoc.querySelector('.chart-markup-table');
          if (!table) { callback(65); return; }
          var iframeRect = iframe.getBoundingClientRect();
          var tableRect = table.getBoundingClientRect();
          var w = tableRect.left - iframeRect.left;
          callback(w > 0 ? w : 65);
        } catch(e) { callback(65); }
      }

      // 初始化 MACD overlay（在 TV 容器内，absolute 定位在时间轴上方）
      function initMacdOverlay(code) {
        var tvContainer = document.getElementById('tv_chart_container_1');
        if (!tvContainer) return;

        tvContainer.style.position = 'relative';
        var existing = document.getElementById('tv_macd_overlay');
        if (existing) existing.remove();

        var overlay = document.createElement('div');
        overlay.id = 'tv_macd_overlay';
        overlay.style.cssText = 'position:absolute; left:0; bottom:28px; width:100%; height:120px; z-index:10; overflow:hidden; background:#FFFEF5;border-top:1px solid #e8e0c8;';
        overlay.innerHTML =
          '<div style="display:flex;width:100%;height:100%">' +
            '<div id="macd_left_scale" style="background:#FFFEF5;border-right:1px solid #e8e0c8;"></div>' +
            '<div style="flex:1;display:flex;flex-direction:column;min-width:0;">' +
              '<div style="font-size:11px;color:#999;padding:1px 6px;background:#FFFEF5;line-height:14px;">MACD</div>' +
              '<div id="macd_lc_chart" style="flex:1;min-height:0;border:none;outline:none;"></div>' +
            '</div>' +
          '</div>';
        tvContainer.appendChild(overlay);

        // 测量价格轴宽度后渲染
        setTimeout(function() {
          measureLeftScaleWidth(function(scaleWidth) {
            var scaleEl = document.getElementById('macd_left_scale');
            if (scaleEl) scaleEl.style.width = (scaleWidth || 65) + 'px';
            renderMacdChart(code, scaleWidth || 65);
          });
        }, 1500);

        $(window).off('resize.macd').on('resize.macd', function() {
          renderMacdChart(code);
        });
      }

      function renderMacdChart(code, scaleWidth) {
        var lcDiv = document.getElementById('macd_lc_chart');
        if (!lcDiv) return;
        var code = code || Utils.get_code();
        var chartWidth = lcDiv.clientWidth || (window.innerWidth - (scaleWidth || 65) - 20);

        fetch('/api/v1/kline/' + code + '?period=daily&limit=365&indicators=true')
          .then(function(r) { return r.json(); })
          .then(function(data) {
            var klines = data.data || [];
            var macdInd = (data.indicators || {}).macd || {};
            if (!klines.length || !macdInd || !macdInd.MACD) return;

            var times = klines.map(function(d) { return d.date.slice(0,10); });
            var lw = LightweightCharts;

            if (macdChartInstance) {
              macdChartInstance.resize(chartWidth, lcDiv.clientHeight);
            } else {
              macdChartInstance = lw.createChart(lcDiv, {
                width: chartWidth,
                height: lcDiv.clientHeight,
                layout: { background: { type: 'solid', color: '#FFFEF5' }, textColor: '#666', fontSize: 10 },
                grid: { vertLines: { color: '#e8e0c8' }, horzLines: { color: '#e8e0c8' } },
                timeScale: { visible: true, borderColor: '#d0d0d0', timeVisible: false },
                rightPriceScale: { borderColor: '#d0d0d0', scaleMargins: { top: 0.15, bottom: 0.05 } },
                crosshair: { mode: 0, vertLine: { color: '#999', width: 1, style: 0 }, horzLine: { color: '#999', width: 1, style: 0 } },
              });
            }

            // 柱 (DIF-DEA)
            var histData = macdInd.MACD.map(function(v, i) {
              if (v === null || v === undefined) return null;
              return { time: times[i], value: v };
            }).filter(Boolean);
            var seriesH = macdChartInstance._series_hist;
            if (!seriesH) {
              seriesH = macdChartInstance.addSeries(lw.HistogramSeries, {
                color: '#26a69a', priceFormat: { type: 'volume' },
                priceScaleId: 'right',
              });
              macdChartInstance._series_hist = seriesH;
            }
            if (histData.length) seriesH.setData(histData);

            // DIF 线
            var difData = macdInd.DIF.map(function(v, i) {
              if (v === null || v === undefined) return null;
              return { time: times[i], value: v };
            }).filter(Boolean);
            var seriesD = macdChartInstance._series_dif;
            if (!seriesD) {
              seriesD = macdChartInstance.addSeries(lw.LineSeries, {
                color: '#ee0a24', lineWidth: 1,
              });
              macdChartInstance._series_dif = seriesD;
            }
            if (difData.length) seriesD.setData(difData);

            // DEA 线
            var deaData = macdInd.DEA.map(function(v, i) {
              if (v === null || v === undefined) return null;
              return { time: times[i], value: v };
            }).filter(Boolean);
            var seriesE = macdChartInstance._series_dea;
            if (!seriesE) {
              seriesE = macdChartInstance.addSeries(lw.LineSeries, {
                color: '#07c160', lineWidth: 1,
              });
              macdChartInstance._series_dea = seriesE;
            }
            if (deaData.length) seriesE.setData(deaData);

            macdChartInstance.timeScale().fitContent();
          })
          .catch(function(e) { console.error('MACD init error:', e); });
      }

      function syncMacdTimeRange() {
        if (!macdChartInstance || !chart_widgets.length) return;
        try {
          var w = chart_widgets[0];
          if (!w || !w.chart) return;
          var range = w.chart.getVisibleRange();
          if (range && range.from && range.to) {
            var fromStr = typeof range.from === 'number'
              ? new Date(range.from * 1000).toISOString().slice(0,10)
              : String(range.from).slice(0,10);
            var toStr = typeof range.to === 'number'
              ? new Date(range.to * 1000).toISOString().slice(0,10)
              : String(range.to).slice(0,10);
            macdChartInstance.timeScale().setVisibleRange({
              from: fromStr,
              to: toStr,
            });
          }
        } catch(e) { /* ignore */ }
      }

      // TV 十字线 → MACD 竖线标记
      function syncMacdCrosshair() {
        if (!chart_widgets.length) return;
        try {
          var w = chart_widgets[0];
          if (!w || !w.chart) return;
          w.chart.onCrosshairMoved().subscribe(null, function(param) {
            if (!macdChartInstance || !param || !param.time) return;
            var t = param.time;
            // 用 LineSeries 画竖线标记
            if (!macdCrosshairLine) {
              macdCrosshairLine = macdChartInstance.addSeries(LightweightCharts.LineSeries, {
                color: '#888', lineWidth: 1, priceLineVisible: false,
                lastValueVisible: false,
              });
            }
            var timeStr = typeof t === 'number'
              ? new Date(t * 1000).toISOString().slice(0,10)
              : String(t).slice(0,10);
            macdCrosshairLine.setData([{ time: timeStr, value: 0 }]);
          });
        } catch(e) { /* ignore: TV widget might not expose crosshair API */ }
      }

      // 初始化展示页面
      function init_web() {
        // 如果市场不是 a，则隐藏 collapse-bkgn
        if (Utils.get_market() !== "a") {
          $("#collapse-bkgn").hide();
        }

        let chart_layout_type =
          Utils.get_local_data("chart_layout_type") || "single";
        let charts_area = $("#tv_charts_area");
        charts_area.empty();
        let win_height = window.innerHeight;
        let win_width = charts_area.width() || window.innerWidth;
        let chart_configs = [];
        if (chart_layout_type === "single") {
          // 单容器：TV 占大部分，底部 padding 留出 MACD + 时间轴空间
          charts_area.css({ display: "block" });
          var totalH = Math.floor(win_height);
          charts_area.append('<div id="tv_chart_container_1" style="width:100%;height:' + totalH + 'px;position:relative;padding-bottom:148px;box-sizing:border-box;"></div>');
          chart_widgets = [];
          chart_widgets.push(Charts.show_tv_chart("1", totalH - 148));
          // MACD overlay（在容器 padding 区域内，不遮挡 TV 成交量区）
          var code = Utils.get_code();
          setTimeout(function() { initMacdOverlay(code); }, 1000);
          // 主图范围变化时同步 MACD 时间轴
          setTimeout(function() {
            if (chart_widgets.length && chart_widgets[0].chart) {
              try {
                chart_widgets[0].chart.onVisibleRangeChanged().subscribe(null, function() {
                  syncMacdTimeRange();
                });
              } catch(e) {}
              // 同步十字线
              try {
                syncMacdCrosshair();
              } catch(e) {}
            }
          }, 2000);
          ZiXuan.render_zixuan_opts();
          return;
        }
        if (chart_layout_type === "horizontal-2") {
          chart_configs = [
            { id: "1", style: "flex:1;" },
            { id: "2", style: "flex:1;" },
          ];
          charts_area.css({ display: "flex", flexDirection: "column" });
        } else if (chart_layout_type === "three") {
          chart_configs = [{ id: "1" }, { id: "2" }, { id: "3" }];
          charts_area.css({ display: "flex", flexDirection: "column" });
        } else if (chart_layout_type === "horizontal-7-3") {
          chart_configs = [{ id: "1" }, { id: "2" }];
          charts_area.css({ display: "flex", flexDirection: "column" });
        } else if (chart_layout_type === "four") {
          chart_configs = [
            { id: "1", style: "width:50%;height:50%;float:left;" },
            { id: "2", style: "width:50%;height:50%;float:left;" },
            { id: "3", style: "width:50%;height:50%;float:left;" },
            { id: "4", style: "width:50%;height:50%;float:left;" },
          ];
          charts_area.css({
            display: "flex",
            flexDirection: "row",
            flexWrap: "wrap",
          });
        }

        chart_widgets = [];
        if (chart_layout_type === "horizontal-7-3") {
          charts_area.append(
            '<div id="tv_chart_container_1" style="width:100%;height:' +
              win_height * 0.7 +
              'px;"></div>',
          );
          charts_area.append(
            '<div id="tv_chart_container_2" style="width:100%;height:' +
              win_height * 0.3 +
              'px;"></div>',
          );
          chart_widgets.push(Charts.show_tv_chart("1", win_height * 0.7));
          chart_widgets.push(Charts.show_tv_chart("2", win_height * 0.3));
        } else if (chart_layout_type === "three") {
          // 上面一行两个图
          let rowDiv = $(
            '<div style="display:flex;width:100%;height:' +
              win_height / 2 +
              'px;"></div>',
          );
          rowDiv.append(
            '<div id="tv_chart_container_1" style="flex:1;"></div>',
          );
          rowDiv.append(
            '<div id="tv_chart_container_2" style="flex:1;"></div>',
          );
          charts_area.append(rowDiv);
          // 下面一行一个图
          charts_area.append(
            '<div id="tv_chart_container_3" style="width:100%;height:' +
              win_height / 2 +
              'px;"></div>',
          );
          chart_widgets.push(Charts.show_tv_chart("1", win_height / 2));
          chart_widgets.push(Charts.show_tv_chart("2", win_height / 2));
          chart_widgets.push(Charts.show_tv_chart("3", win_height / 2));
        } else {
          chart_configs.forEach(function (cfg, idx) {
            let div_id = "tv_chart_container_" + cfg.id;
            charts_area.append(
              '<div id="' +
                div_id +
                '" style="' +
                (cfg.style || "") +
                '"></div>',
            );
            // 计算每个图表的高度/宽度
            let chart_height =
              chart_layout_type === "single"
                ? win_height
                : chart_layout_type === "vertical-2" ||
                    chart_layout_type === "horizontal-2"
                  ? win_height / 2
                  : chart_layout_type === "four"
                    ? win_height / 2
                    : win_height;
            chart_widgets.push(Charts.show_tv_chart(cfg.id, chart_height));
          });
        }
        ZiXuan.render_zixuan_opts();
      }

      init_web();
      interval_update_rates = setInterval(ZiXuan.stocks_update_rate(), 30000);
    });
  </script>
</html>
